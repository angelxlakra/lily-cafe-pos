# fly.toml — Fly.io app configuration for Lily Cafe POS backend
app = "lily-cafe-pos"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/restaurant.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # Never sleep — cafe needs instant response at 6am
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "lily_cafe_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
