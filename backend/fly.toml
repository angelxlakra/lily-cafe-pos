# fly.toml app configuration file generated for lily-cafe-pos on 2026-05-13T23:48:05+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lily-cafe-pos'
primary_region = 'sin'  # must match the volume's region

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1  # cold starts blew past the frontend's 10s timeout
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = 'lily_cafe_data'
  destination = '/data'
